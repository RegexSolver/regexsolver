name: Rust

on:
  push:
    branches: ["main", "v1"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `--all-targets` also builds the examples and the benchmark, which are
      # otherwise only compiled by clippy.
      - name: Test with default features
        run: cargo test --locked --all-targets
      - name: Test with no default features
        run: cargo test --locked --no-default-features --all-targets

      # `--all-targets` skips doctests, and the public API is documented with
      # them.
      - name: Doctests
        run: cargo test --locked --doc

  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Nightly with `--cfg docsrs`, to match how docs.rs builds the crate.
      - name: Build documentation
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # Keep the declared `rust-version` (MSRV) honest, for both feature configs.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # Single source of truth: the MSRV comes from Cargo.toml. It is passed as
      # an input rather than as the action ref, because a numeric ref such as
      # `dtolnay/rust-toolchain@1.88` looks like an action version to Dependabot.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check on MSRV
        run: |
          cargo check --locked --all-features
          cargo check --locked --no-default-features

  # `wasm32-unknown-unknown` has no threads, no clock and no system randomness,
  # so a dependency reaching for one of them either fails to compile
  # (`getrandom`) or panics at runtime; `wasm32-wasip1` has all three but no
  # thread spawning.
  wasm:
    name: WebAssembly (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build with default features
        run: cargo build --locked --lib --target ${{ matrix.target }}
      - name: Build with no default features
        run: cargo build --locked --lib --no-default-features --target ${{ matrix.target }}

      # `wasm32-wasip1` is the only one of the two that can run the test
      # harness: `wasm32-unknown-unknown` has no way to start a process or
      # print to stdout, which libtest needs. The tests that panic on purpose
      # are `ignore`d for `wasm`, which is `panic = abort`.
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        if: matrix.target == 'wasm32-wasip1'
      - name: Test with default features
        if: matrix.target == 'wasm32-wasip1'
        env:
          # `--dir` grants the guest the `tests/data` the integration tests read.
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=.
        run: cargo test --locked --tests --target ${{ matrix.target }}
      - name: Test with no default features
        if: matrix.target == 'wasm32-wasip1'
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=.
        run: cargo test --locked --tests --no-default-features --target ${{ matrix.target }}

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Catches an `include` in Cargo.toml that leaves a file the crate needs
      # out of the published tarball.
      - name: Dry-run publish
        run: cargo publish --locked --dry-run

  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # audit-check files an issue when a vulnerability is found

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
