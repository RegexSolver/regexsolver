name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate publishing behind a protected GitHub environment so the crates.io
    # token is only exposed to reviewed, tag-triggered runs. Configure required
    # reviewers on this environment in the repository settings.
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Never publish a crate whose version disagrees with the pushed tag.
      - name: Verify tag matches Cargo.toml version
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${tag_version}) does not match Cargo.toml version ${crate_version}"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
          cargo clippy --locked --features neural-synthesis-hub --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test --locked --all-targets
          cargo test --locked --no-default-features --all-targets
          cargo test --locked --features neural-synthesis-hub --all-targets
          cargo test --locked --features neural-synthesis-hub --doc
      - name: Docs
        run: cargo doc --locked --features neural-synthesis-hub --no-deps

      # The version bump must match the API changes since the latest release
      # (a deprecation needs a minor release, a removal a major one). Features
      # as in CI: the GPU backends need their toolkits, and add no API.
      - name: Semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: only-explicit-features
          features: parallel,neural-synthesis-hub

      # Also verify the declared MSRV before publishing, like CI does.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
      # `neural-synthesis-hub` is left out: its Hub client needs a newer Rust
      # (documented in the README), and the GPU backends need their toolkits.
      - name: Check on MSRV
        run: |
          cargo +${{ steps.msrv.outputs.msrv }} check --locked --features neural-synthesis
          cargo +${{ steps.msrv.outputs.msrv }} check --locked --no-default-features

      # Checks the tarball is complete and builds on its own, before an upload
      # that cannot be undone.
      - name: Dry-run publish
        run: cargo +stable publish --locked --dry-run

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: cargo +stable publish --locked
